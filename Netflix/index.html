<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Style Align</title>
  <link rel="stylesheet" href="../style.css">
</head>
<body>

  <script>
    const CONFIG = {
      description: "Scroll down this page and review the images. Select 2–5 that you really love; and 1–4 that you really dislike/hate. We're looking for strong reactions, no lukewarm feelings! Your choices should be made based on your personal aesthetic alone — don't worry about how this relates to your organization's needs.",
      email: "info@fix.studio",
      assets: [
        "_1.jpg", "_2.jpg", "_3.jpg", "_4.jpg", "_5.jpg", "_6.jpg", "_7.jpg", "_8.jpg", "_9.jpg", "_10.jpg",
        "_11.jpg", "_12.jpg", "_13.jpg", "_14.jpg", "_15.jpg", "_16.jpg", "_17.jpg", "_18.jpg", "_19.jpg", "_20.jpg",
        "_21.jpg", "_22.jpg", "_23.jpg", "_24.jpg", "_25.jpg", "_26.jpg", "_27.jpg", "_28.jpg", "_29.jpg", "_30.jpg",
        "_31.jpg", "_32.jpg", "_33.jpg", "_34.jpg", "_35.jpg", "_36.jpg", "_37.jpg", "_38.jpg", "_39.jpg", "_40.jpg",
        "_41.jpg", "_42.jpg", "_43.jpg", "_44.jpg", "_45.jpg", "_46.jpg", "_47.jpg", "_48.jpg", "_49.jpg", "_50.jpg",
        "_51.jpg", "_52.jpg", "_53.jpg", "_54.jpg", "_55.jpg", "_56.jpg", "_57.jpg", "_58.jpg", "_59.jpg", "_60.jpg",
        "_61.jpg", "_62.jpg", "_63.jpg", "_64.jpg", "_65.jpg", "_66.jpg", "_67.jpg", "_68.jpg", "_69.jpg", "_70.jpg",
        "_71.jpg", "_72.jpg", "_73.jpg", "_74.jpg", "_75.jpg", "_76.jpg", "_77.jpg", "_78.jpg", "_79.jpg", "_80.jpg",
        "_81.jpg", "_82.jpg", "_83.jpg", "_84.jpg", "_85.jpg", "_86.jpg", "_87.jpg", "_88.jpg"
      ]
    };
  </script>

  <header id="header">
    <div id="header-grid">
      <div class="header-col" id="header-col-1">
        <span id="studio-name">Fix Studio</span>
      </div>
      <div class="header-col" id="header-col-2">
        <span id="client-name"></span>
        <span>Style Align</span>
      </div>
      <div class="header-col" id="header-col-3">
        <p id="description"></p>
      </div>
      <div class="header-col" id="header-col-4">
        <span id="header-square"></span>
      </div>
    </div>
    <hr id="header-rule">
  </header>

  <main id="gallery"></main>

  <div id="toast"></div>

  <div id="selection-panel">
    <div id="panel-inner">
      <div id="panel-thumbnails"></div>
      <div id="panel-actions">
        <button id="panel-expand-btn" type="button" aria-label="Show selections">
          <svg class="icon-edit" viewBox="0 0 20 20" fill="none" xmlns="http://www.w3.org/2000/svg">
            <path d="M14.85 3.15a2.12 2.12 0 0 1 3 3l-9.5 9.5-4 1 1-4 9.5-9.5z" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
          </svg>
          <svg class="icon-caret" viewBox="0 0 20 20" fill="none" xmlns="http://www.w3.org/2000/svg" style="display:none">
            <polyline points="5,8 10,13 15,8" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"/>
          </svg>
        </button>
        <button id="btn-download" type="button" title="Download ZIP">
          <svg viewBox="0 0 20 20" fill="none" xmlns="http://www.w3.org/2000/svg">
            <path d="M10 3v10m0 0l-3.5-3.5M10 13l3.5-3.5" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
            <path d="M3 15v1.5A1.5 1.5 0 0 0 4.5 18h11a1.5 1.5 0 0 0 1.5-1.5V15" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
          </svg>
        </button>
        <button id="btn-copy" type="button" title="Copy URL">
          <svg id="icon-copy" viewBox="0 0 20 20" fill="none" xmlns="http://www.w3.org/2000/svg">
            <rect x="7" y="7" width="10" height="10" rx="1.5" stroke="currentColor" stroke-width="1.5"/>
            <path d="M13 7V5a1.5 1.5 0 0 0-1.5-1.5H5A1.5 1.5 0 0 0 3.5 5v6.5A1.5 1.5 0 0 0 5 13h2" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
          </svg>
          <svg id="icon-check" viewBox="0 0 20 20" fill="none" xmlns="http://www.w3.org/2000/svg" style="display:none">
            <polyline points="4,10 8,14 16,6" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"/>
          </svg>
        </button>
        <button id="btn-submit" type="button">Submit</button>
      </div>
    </div>
    <div id="panel-expanded-view"></div>
  </div>

  <script src="../app.js"></script>
</body>
</html>
